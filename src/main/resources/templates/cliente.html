<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minha área | Mercado Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-5">
    <div class="content-card p-4 p-lg-5">
        <span class="badge badge-sector mb-3">ÁREA DO CLIENTE · USER</span>
        <h1 class="h2 fw-bold">Bem-vindo(a), <span th:text="${usuarioLogado}">usuário</span>!</h1>
        <p class="text-muted">Você está logado com o perfil <strong>USER</strong>. Aqui você pode consultar os produtos do mercado.</p>

        <div class="row g-3 mt-3">
            <div class="col-md-4">
                <a th:href="@{/web/itens}" class="admin-link-card">
                    <span class="fs-2">📦</span>
                    <strong>Consultar produtos</strong>
                    <small>Veja o catálogo completo do banco de dados.</small>
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
