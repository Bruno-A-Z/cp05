spring:
  application:
    name: amazin-mercado-express

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mercadoexpress}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Zrun0!_Ban4drad3}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  hateoas:
    use-hal-as-default-json-media-type: true

server:
  port: ${PORT:8082}
  # Necessário atrás do proxy do Render (mantém https nos redirects)
  forward-headers-strategy: framework

# Usuário ADMIN criado automaticamente na primeira execução
app:
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}
